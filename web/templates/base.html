<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentora AI - Educational Analytics & Adaptive Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Modern Horizontal Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1>Mentora AI</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Educator Dashboard</a>
            <a href="/student" class="nav-link {% if request.path == '/student' %}active{% endif %}">Student Workspace</a>
            <a href="/quiz" class="nav-link {% if request.path == '/quiz' %}active{% endif %}">Adaptive BKT Quiz & Tutor</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
